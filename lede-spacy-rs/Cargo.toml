[package]
name = "lede-spacy-rs"
version = "0.1.0"
edition = "2024"
description = "Deterministic, license-clean spaCy-class NER + facts companion for the lede Rust crate"
license = "Apache-2.0"
repository = "https://github.com/yonk-labs/lede"
rust-version = "1.85"

[dependencies]
# Path dep on the core lede crate. M1 reuses lede's regex metadata + facts and
# its public types (Metadata, PhraseFact) — no schema drift for consumers.
lede = { path = "../rust" }

[features]
# Opt-in rule-based POS tagger + higher-recall POS facts. No weights, no deps,
# no network — license-clean. The averaged-perceptron path (NLTK/PTB weights)
# is a deferred `pos-perceptron` feature requiring user-supplied weights.
pos = []

[lints.rust]
unsafe_code = "forbid"
