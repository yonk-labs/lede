[package]
name = "lede"
version = "0.4.5"
edition = "2024"
description = "Deterministic extractive summarization — stdlib + regex only"
license = "Apache-2.0"
repository = "https://github.com/yonk-labs/lede"
readme = "../README.md"
keywords = ["summarization", "extractive", "text", "nlp", "tf-idf"]
categories = ["text-processing"]
rust-version = "1.85"

[dependencies]
regex = "1"
text2num = { version = "2.6", optional = true }

[features]
# Optional support for spelled-out numbers ("eight days") in extract::stats
# via the text2num crate (MIT, crates.io). Mirrors Python's `wordforms`
# extra. Default off → default build stays stdlib+regex-only.
wordforms = ["dep:text2num"]

[[bin]]
name = "lede"
path = "src/bin/lede.rs"

[[bin]]
name = "bench_tfidf"
path = "src/bin/bench_tfidf.rs"

[dev-dependencies]
serde_json = "1"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
cast_precision_loss = "allow"
cast_possible_truncation = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
