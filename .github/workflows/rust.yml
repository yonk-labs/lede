name: rust

# No `paths:` filter on push — earlier the filter let rustfmt drift
# accumulate (a docs-only commit wouldn't trigger fmt-check, then a
# rust-touching commit would surface days of drift in one go). Run the
# full Rust pipeline on every push to main instead; CI cost is low.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v5
      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format check
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Build
        run: cargo build --verbose
      - name: Test
        run: cargo test --verbose
      - name: Test (release)
        run: cargo test --release --verbose
      - name: Test (--features wordforms)
        run: cargo test --features wordforms --verbose
      - name: Clippy (--features wordforms)
        run: cargo clippy --all-targets --features wordforms -- -D warnings
      - name: Dependency vulnerability audit (cargo-audit)
        # Cached install; non-strict so a new advisory in a transitive doesn't
        # immediately red-line the build, but warnings surface in the log.
        run: |
          cargo install cargo-audit --locked --quiet
          cargo audit 2>&1 || (echo "::warning::cargo-audit reported issues — see job log" && true)

  lede-enrich:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lede-enrich
    steps:
      - uses: actions/checkout@v5
      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format check
        run: cargo fmt --check
      - name: Clippy (default)
        run: cargo clippy --all-targets -- -D warnings
      - name: Build (default)
        run: cargo build --verbose
      - name: Test (default)
        run: cargo test --verbose
      - name: Clippy (--features crf)
        run: cargo clippy --features crf --all-targets -- -D warnings
      - name: Build (--features crf)
        run: cargo build --features crf --verbose
      - name: Test (--features crf)
        run: cargo test --features crf --verbose
