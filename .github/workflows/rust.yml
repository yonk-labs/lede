name: rust

# No `paths:` filter on push — earlier the filter let rustfmt drift
# accumulate (a docs-only commit wouldn't trigger fmt-check, then a
# rust-touching commit would surface days of drift in one go). Run the
# full Rust pipeline on every push to main instead; CI cost is low.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format check
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Build
        run: cargo build --verbose
      - name: Test
        run: cargo test --verbose
      - name: Test (release)
        run: cargo test --release --verbose
