name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install with dev + all optional extras
        run: |
          python -m pip install --upgrade pip
          # Default + every optional extra so each path gets exercised by CI.
          # textrank: networkx-based PageRank summarizer.
          # wordforms: text2num spelled-out-number support.
          # yake: statistical key-phrase backend for extract.phrases.
          pip install -e ".[dev,textrank,wordforms,yake]"
      - name: Run pytest (core)
        run: pytest -q
      - name: Verify wordforms-extra path
        run: |
          python -c "
          from skimr.extract import stats
          # Without text2num present this would import-error; presence here
          # confirms the [wordforms] extra path actually exercises the code.
          import text_to_num  # noqa: F401
          out = stats('eight days passed.', convert_word_names=True)
          assert any(s.stat_type == 'duration' and 'eight' in s.value for s in out), out
          print('wordforms: OK')
          "
      - name: Verify yake-extra path
        run: |
          python -c "
          import yake  # noqa: F401  — confirms the [yake] extra installed
          from skimr.extract import phrases
          out = phrases('Distributed systems are hard. Distributed systems pay well.',
                        backend='yake')
          assert isinstance(out, tuple)
          print('yake: OK')
          "
      - name: Smoke-test all examples in examples/
        run: |
          # Skip examples that require companion packages we don't install in
          # this job (06_ needs skimr-spacy; 07_ needs [wordforms]).
          for f in examples/01_quickstart.py examples/02_rag_prep.py \
                   examples/03_brief.py examples/04_extract_primitives.py \
                   examples/05_chunked_pipeline.py examples/07_wordforms_numbers.py; do
            echo "::group::$f"
            python "$f"
            echo "::endgroup::"
          done
      - name: Dependency vulnerability audit (pip-audit)
        # Warn-only on findings — surface them in the log without breaking the
        # build, so a transitive dep getting a fresh advisory doesn't block
        # unrelated work. Triage in the next regular release. If you need to
        # suppress a specific advisory, add `--ignore-vuln <GHSA-id>` here AND
        # leave a comment explaining what's suppressed and when to revisit.
        run: |
          python -m pip install pip-audit
          pip-audit --strict 2>&1 || \
            (echo "::warning::pip-audit reported issues — see job log" && true)
