[package]
name = "lede-enrich"
version = "0.1.0"
edition = "2024"
description = "Deterministic, license-clean classical NLP enrichment for the lede Rust path — gazetteer NER, numeric facts, opt-in POS, lemma. No spaCy, no transformers."
license = "Apache-2.0"
repository = "https://github.com/yonk-labs/lede"
readme = "README.md"
keywords = ["nlp", "ner", "entities", "lede", "deterministic"]
categories = ["text-processing"]
rust-version = "1.85"

[dependencies]
# Core lede crate. version+path: `version` is used when published to crates.io,
# `path` for local development in this repo. M1 reuses lede's regex metadata +
# facts and its public types (Metadata, PhraseFact) — no schema drift.
lede = { version = "0.5", path = "../rust" }

# Pure-Rust CRFsuite port (MIT). Training + inference. Only pulled by `crf`.
# Latest resolved 0.4.1 as of 2026-06-22; confirm with Step 1's dry-run.
crfs = { version = "0.4", optional = true }

[features]
# Opt-in rule-based POS tagger + higher-recall POS facts. No weights, no deps,
# no network — license-clean. The averaged-perceptron path (NLTK/PTB weights)
# is a deferred `pos-perceptron` feature requiring user-supplied weights.
pos = []

# Opt-in distilled CRF NER. Bundles self-generated weights in-crate
# (models/ner.crfsuite). Adds typed `extract_entities_typed`. Never default.
crf = ["dep:crfs"]

[lints.rust]
unsafe_code = "forbid"

[[bin]]
name = "train_ner"
path = "src/bin/train_ner.rs"
required-features = ["crf"]
