[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lede"
version = "0.4.3"
description = "Deterministic extractive summarization — zero runtime dependencies"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Yonk" }]
keywords = ["summarization", "extractive", "text", "nlp", "tf-idf", "textrank"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Text Processing :: Linguistic",
]
dependencies = []

[project.optional-dependencies]
# textrank uses networkx._pagerank_python (private API; underscore prefix).
# Pin <3.5 so a future networkx minor that renames or removes that
# function doesn't silently break the [textrank] extra at install time.
# Drop the upper bound once textrank is rewritten against networkx's
# public API or a custom PageRank implementation lands.
textrank = ["networkx>=3.0,<3.5"]
wordforms = ["text2num>=3.0"]
yake = ["yake>=0.4.8"]
dev = ["pytest>=7", "pytest-subtests>=0.10"]
bench = ["sumy>=0.11", "numpy>=1.24"]

[project.scripts]
lede = "lede.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/lede"]

[tool.hatch.build.targets.sdist]
# Explicit include list — without this, hatchling scans the whole repo
# (rust/target/, .venv/, skill-output/) which balloons the sdist.
include = [
    "src/lede",
    "tests",
    "README.md",
    "LICENSE",
    "CHANGELOG.md",
    "pyproject.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
