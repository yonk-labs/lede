[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lede-spacy"
version = "0.4.3"
description = "spaCy-powered enrichment backend for lede — PERSON/ORG/GPE entity extraction via en_core_web_sm."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Yonk" }]
keywords = ["lede", "ner", "spacy", "entity-extraction"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Text Processing :: Linguistic",
]
dependencies = [
    "lede>=0.4.0",
    "spacy>=3.8,<3.9",
]

[project.urls]
Homepage = "https://github.com/yonk-labs/lede"
Repository = "https://github.com/yonk-labs/lede"
Issues = "https://github.com/yonk-labs/lede/issues"

[project.optional-dependencies]
dev = ["pytest>=7"]
synonyms = ["nltk>=3.8"]

[tool.hatch.build.targets.wheel]
packages = ["src/lede_spacy"]

[tool.hatch.build.targets.sdist]
include = [
    "src/lede_spacy",
    "tests",
    "README.md",
    "LICENSE",
    "pyproject.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
